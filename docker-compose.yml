services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gmail_email_db
      POSTGRES_USER: gmail_mcp
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://gmail_mcp:change-me@db:5432/gmail_email_db
      PUBLIC_BASE_URL: http://localhost:8000
      GOOGLE_CLIENT_SECRETS_FILE: credentials.json
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/auth/google/callback
      GOOGLE_PUBSUB_TOPIC: projects/YOUR_PROJECT_ID/topics/gmail-email-events
      GOOGLE_PUBSUB_AUDIENCE: http://localhost:8000/webhooks/google/pubsub
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      MCP_API_KEY: ${MCP_API_KEY}
    ports: ["8000:10000"]
    depends_on: [db]
volumes:
  postgres_data:
